organism: "Scientific name of the organism"
tissue: "Tissue type"
cell_type: "Cell type"
cell_line: "Cell line"
genotype: "Genotype/genetic background"
condition: "Experimental condition"
treatment: "Treatment applied"
inhibitor: "Ribosome translocation inhibitor used (e.g. Cycloheximide, Tigecycline, Harringonine)"
